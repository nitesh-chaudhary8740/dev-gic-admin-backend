
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Clone</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
        }
        header {
            background-color: #3498db;
            color: white;
            text-align: center;
            padding: 1em;
        }
        nav {
            display: flex;
            justify-content: space-around;
            padding: 1em;
        }
        nav a {
            font-size: 1.2em;
            color: #fff;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        nav a:hover {
            background-color: #6c757d;
        }
        main {
            padding: 4em;
        }
        section {
            margin-bottom: 2em;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            width: calc(33.33% - 20px);
            box-sizing: border-box;
            margin-right: 5px;
            transition: transform 0.3s;
        }
        .product-card:hover {
            transform: scale(1.05);
        }
        .card-header {
            background-color: #e84d62;
            color: white;
            text-align: center;
            padding: 1em;
            margin-bottom: 1em;
        }
        .card-body {
            padding: 1em;
        }
        footer {
            background-color: #3498db;
            color: white;
            text-align: center;
            padding: 2em;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Amazon Clone</h1>
    </header>

    <nav>
        <a href="#products">Products</a>
        <a href="#about-us">About Us</a>
        <a href="#contact-us">Contact Us</a>
    </nav>

    <section id="products">
        <h2>Featured Products</h2>
        <div class="product-card">
            <div class="card-header"><strong>Product 1</strong></div>
            <div class="card-body">
                <img src="https://via.placeholder.com/300x400" alt="Product Image">
                <p>Description of the product goes here...</p>
            </div>
        </div>

        <!-- Add more products as needed -->
    </section>

    <section id="about-us">
        <h2>About Us</h2>
        <p>This is where you could add information about your company, its mission, and values.</p>
    </section>

    <footer>
        <p>&copy; 2026 Amazon Clone. All rights reserved.</p>
    </footer>
</body>
</html>
